<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09131f"/>
      <stop offset=".45" stop-color="#080c14"/>
      <stop offset="1" stop-color="#0d1824"/>
    </linearGradient>
    <radialGradient id="ag1" cx=".78" cy=".3" r=".65">
      <stop offset="0" stop-color="#4f9cf9" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#3b82f6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag2" cx=".2" cy=".75" r=".55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#38bdf8" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="apanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2e" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0a101b" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="acyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#abg)"/>
  <rect width="1600" height="700" fill="url(#agrid)"/>
  <rect width="1600" height="700" fill="url(#ag1)"/>
  <rect width="1600" height="700" fill="url(#ag2)"/>

  <!-- Left: Academy Branding & Concept -->
  <g transform="translate(100 210)">
    <rect width="180" height="34" rx="17" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="Sora,Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="2">PROJET PRIVÉ · TEASER</text>
    <text x="0" y="95" font-family="Sora,Segoe UI,sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">ACADÉMIE NEXORIA</text>
    <text x="0" y="145" font-family="Figtree,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#94a3b8">L’art du Mapping, du Code GLua et des VFX Source Engine.</text>
    <text x="0" y="180" font-family="Figtree,Segoe UI,sans-serif" font-size="16" font-weight="500" fill="#38bdf8">■ Parcours Débutant à Avancé &nbsp;■ 3D Blender &amp; Hammer &nbsp;■ Shaders immersifs</text>
  </g>

  <!-- Right: 3D Isometric Viewport & Code Visual -->
  <g transform="translate(860 110) skewY(-4)">
    <!-- Main Window -->
    <rect width="660" height="460" rx="20" fill="url(#apanel)" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.5"/>
    <!-- Topbar -->
    <rect width="660" height="42" rx="20" fill="#ffffff" opacity=".03"/>
    <circle cx="28" cy="21" r="5" fill="#ef4444" opacity=".8"/>
    <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity=".8"/>
    <circle cx="60" cy="21" r="5" fill="#10b981" opacity=".8"/>
    <text x="330" y="26" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-size="12" fill="#64748b">nexoria-academy://course/mapping-3d/hammer-blender</text>

    <!-- 3D Grid wireframe cube -->
    <g transform="translate(80 100)">
      <polygon points="120,40 220,95 120,150 20,95" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity=".8"/>
      <polygon points="20,95 120,150 120,265 20,210" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" stroke-opacity=".7"/>
      <polygon points="220,95 120,150 120,265 220,210" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity=".9"/>
      <circle cx="120" cy="150" r="4" fill="#38bdf8"/>
      <line x1="120" y1="150" x2="120" y2="40" stroke="#7dd3fc" stroke-dasharray="3 3"/>
      <text x="120" y="295" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#7dd3fc">HAMMER 3D VIEWPORT</text>
    </g>

    <!-- Code Editor Box -->
    <g transform="translate(340 85)">
      <rect width="280" height="320" rx="12" fill="#050a12" stroke="#1e293b"/>
      <rect x="0" y="0" width="280" height="30" rx="12" fill="#0d1522"/>
      <text x="16" y="20" font-family="JetBrains Mono,monospace" font-size="11" fill="#38bdf8">init.lua</text>
      <!-- Code lines -->
      <text x="16" y="55" font-family="JetBrains Mono,monospace" font-size="11" fill="#f43f5e">function <tspan fill="#38bdf8">Spell:Cast</tspan><tspan fill="#94a3b8">(ply, target)</tspan></text>
      <text x="32" y="78" font-family="JetBrains Mono,monospace" font-size="11" fill="#94a3b8">local mana = ply:GetMana()</text>
      <text x="32" y="101" font-family="JetBrains Mono,monospace" font-size="11" fill="#a855f7">if mana &gt;= 50 then</text>
      <text x="48" y="124" font-family="JetBrains Mono,monospace" font-size="11" fill="#10b981">VFX:CreatePortal(ply)</text>
      <text x="48" y="147" font-family="JetBrains Mono,monospace" font-size="11" fill="#fbbf24">ply:DrainMana(50)</text>
      <text x="32" y="170" font-family="JetBrains Mono,monospace" font-size="11" fill="#a855f7">end</text>
      <text x="16" y="193" font-family="JetBrains Mono,monospace" font-size="11" fill="#f43f5e">end</text>
      <rect x="16" y="220" width="248" height="70" rx="8" fill="#0e1726" stroke="#38bdf8" stroke-opacity=".3"/>
      <text x="30" y="245" font-family="Sora,sans-serif" font-size="11" font-weight="700" fill="#38bdf8">PARCOURS INTERACTIF</text>
      <text x="30" y="268" font-family="Figtree,sans-serif" font-size="12" fill="#94a3b8">Apprends en construisant pas-à-pas.</text>
    </g>
  </g>
</svg>