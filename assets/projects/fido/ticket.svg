        <text x="22" y="230">🐞  <tspan font-weight="700" fill="#f2f3f5">Bug</tspan> — signaler un bug du bot</text>
        <text x="22" y="260">⚠️  <tspan font-weight="700" fill="#f2f3f5">Plainte</tspan> — signaler un membre</text>
