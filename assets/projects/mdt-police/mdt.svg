<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1736"/><stop offset="1" stop-color="#050a18"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b6cff"/><stop offset="1" stop-color="#8fb0ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5b8cff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/><rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="70" fill="#081230"/><rect y="70" width="1280" height="2" fill="#3b6cff" opacity=".6"/>
  <path d="M46 18 L56 38 L78 40 L62 54 L66 76 L46 64 L26 76 L30 54 L14 40 L36 38 Z" transform="translate(0 -8) scale(.85)" fill="#0a1636" stroke="#c7d6ff" stroke-width="2.5"/>
  <text x="84" y="34" font-size="20" font-weight="800" fill="#fff" letter-spacing="2">MDT — RÉSEAU TACTIQUE CENTRAL</text>
  <text x="84" y="56" font-size="13" fill="#8fa6d6">Terminal opérationnel · Branche Gendarmerie</text>
  <rect x="1030" y="18" width="220" height="36" rx="18" fill="#22d97f" opacity=".15"/><circle cx="1054" cy="36" r="6" fill="#22d97f"/><text x="1070" y="42" font-size="14" font-weight="700" fill="#86efac">EN SERVICE · 01:42:17</text>
  <g font-size="14" font-weight="600">
    <rect x="40" y="100" width="150" height="40" rx="10" fill="#3b6cff"/><text x="115" y="125" text-anchor="middle" fill="#fff">Gendarmerie</text>
    <rect x="202" y="100" width="130" height="40" rx="10" fill="#ffffff" opacity=".06"/><text x="267" y="125" text-anchor="middle" fill="#8fa6d6">Généraux</text>
