    <g font-size="14" fill="#e5edf7">
      <text x="28" y="90"><tspan fill="#8fa6d6">21:40</tspan>   Cycle de service validé · +100</text>
      <text x="28" y="126"><tspan fill="#8fa6d6">21:30</tspan>   Contrôle routier · note ajoutée</text>
      <text x="28" y="162"><tspan fill="#8fa6d6">21:12</tspan>   Bonus d’intervention · +500</text>
      <text x="28" y="198"><tspan fill="#8fa6d6">20:58</tspan>   Vigilance passée au niveau 2</text>
      <text x="28" y="234"><tspan fill="#8fa6d6">20:00</tspan>   Prise de service</text>
    </g>
  </g>
  <g transform="translate(630 460)">
    <rect width="300" height="300" rx="18" fill="#ffffff" opacity=".05" stroke="#5b8cff" stroke-opacity=".3"/>
    <text x="28" y="44" font-size="16" font-weight="700" fill="#fff">Notes opérationnelles</text>
    <g fill="#ffffff" opacity=".18"><rect x="28" y="72" width="240" height="10" rx="5"/><rect x="28" y="98" width="200" height="10" rx="5"/><rect x="28" y="124" width="220" height="10" rx="5"/><rect x="28" y="150" width="150" height="10" rx="5"/></g>
  </g>
  <g transform="translate(950 460)">
    <rect width="290" height="300" rx="18" fill="#ff3b4f" opacity=".14" stroke="#ff4d5a" stroke-width="2"/>
    <circle cx="145" cy="120" r="64" fill="#ff3b4f"/><circle cx="145" cy="120" r="84" fill="none" stroke="#ff4d5a" stroke-opacity=".5" stroke-width="3"/>
    <text x="145" y="134" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">99</text>
    <text x="145" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" letter-spacing="2">ALERTE CODE 99</text>
    <text x="145" y="266" text-anchor="middle" font-size="13" fill="#fecaca">Signal d’urgence visuel et sonore</text>
  </g>
  <g transform="translate(1100 82)"><rect width="166" height="26" rx="13" fill="#000" opacity=".55"/><text x="83" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">IMAGE D’EXEMPLE</text></g>
