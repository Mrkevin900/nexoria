    <text x="28" y="110" font-size="64" font-weight="800" fill="#fff">12 480</text>
    <text x="300" y="110" font-size="18" font-weight="700" fill="#86efac">+100 / 10 min</text>
    <text x="28" y="160" font-size="14" fill="#8fa6d6">Grade actuel : <tspan fill="#fff" font-weight="700">Maréchal des logis</tspan></text>
    <rect x="28" y="182" width="504" height="14" rx="7" fill="#ffffff" opacity=".08"/><rect x="28" y="182" width="356" height="14" rx="7" fill="url(#bar)"/>
    <text x="28" y="228" font-size="13" fill="#8fa6d6">71 % vers <tspan fill="#c7d6ff" font-weight="700">Adjudant</tspan></text>
  </g>
  <g transform="translate(630 170)">
    <rect width="610" height="260" rx="18" fill="#ffffff" opacity=".05" stroke="#5b8cff" stroke-opacity=".3"/>
    <text x="28" y="44" font-size="14" fill="#8fa6d6">Mode de gain</text>
    <g font-size="15" font-weight="700">
      <rect x="28" y="64" width="170" height="78" rx="14" fill="#3b6cff" opacity=".25" stroke="#7aa2ff"/><text x="113" y="98" text-anchor="middle" fill="#fff">Standard</text><text x="113" y="124" text-anchor="middle" font-size="13" fill="#c7d6ff">+100 pts</text>
      <rect x="216" y="64" width="170" height="78" rx="14" fill="#ffffff" opacity=".05"/><text x="301" y="98" text-anchor="middle" fill="#e5edf7">VIP</text><text x="301" y="124" text-anchor="middle" font-size="13" fill="#8fa6d6">+110 pts</text>
      <rect x="404" y="64" width="178" height="78" rx="14" fill="#ffffff" opacity=".05"/><text x="493" y="98" text-anchor="middle" fill="#fde68a">Premium</text><text x="493" y="124" text-anchor="middle" font-size="13" fill="#8fa6d6">+120 pts</text>
    </g>
    <text x="28" y="186" font-size="14" fill="#8fa6d6">Niveau de vigilance</text>
    <g><rect x="28" y="200" width="104" height="22" rx="6" fill="#22d97f"/><rect x="140" y="200" width="104" height="22" rx="6" fill="#f5b53c"/><rect x="252" y="200" width="104" height="22" rx="6" fill="#ffffff" opacity=".08"/><rect x="364" y="200" width="104" height="22" rx="6" fill="#ffffff" opacity=".08"/><rect x="476" y="200" width="106" height="22" rx="6" fill="#ffffff" opacity=".08"/></g>
