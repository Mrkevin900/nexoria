<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#180c12"/>
      <stop offset=".4" stop-color="#0e0a0d"/>
      <stop offset="1" stop-color="#140b10"/>
    </linearGradient>
    <radialGradient id="g1" cx=".75" cy=".35" r=".6">
      <stop offset="0" stop-color="#e5566a" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#e5566a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".2" cy=".8" r=".5">
      <stop offset="0" stop-color="#ff7387" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <linearGradient id="pn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1620" stop-opacity=".9"/>
      <stop offset="1" stop-color="#120c11" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7387"/>
      <stop offset="1" stop-color="#e5566a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset=".4" stop-color="#0b0b0e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>
  <rect width="1600" height="700" fill="url(#g1)"/>
  <rect width="1600" height="700" fill="url(#g2)"/>

  <!-- Perspective UI Panel -->
  <g transform="translate(840 100) skewY(-5)">
    <!-- Main Window -->
    <rect width="660" height="440" rx="22" fill="url(#pn)" stroke="#e5566a" stroke-opacity=".4" stroke-width="1.5"/>
    <!-- Window Topbar -->
    <rect width="660" height="42" rx="22" fill="#ffffff" opacity=".03"/>
    <circle cx="28" cy="21" r="5" fill="#ef5a5a" opacity=".8"/>
    <circle cx="44" cy="21" r="5" fill="#f0b43c" opacity=".8"/>
    <circle cx="60" cy="21" r="5" fill="#3ecf8e" opacity=".8"/>
    <rect x="90" y="14" width="160" height="14" rx="7" fill="#ffffff" opacity=".08"/>
    <rect x="520" y="11" width="115" height="20" rx="10" fill="#e5566a" fill-opacity=".2" stroke="#e5566a" stroke-opacity=".4"/>
    <text x="577" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#ff7387">STEAM CONNECTÉ</text>

    <!-- Sidebar -->
    <rect x="18" y="56" width="140" height="366" rx="14" fill="#ffffff" opacity=".04"/>
    <g fill="#ffffff">
      <rect x="32" y="74" width="22" height="22" rx="6" fill="url(#red)"/>
      <rect x="62" y="80" width="76" height="10" rx="5" opacity=".8"/>
      <!-- Nav items -->
      <rect x="26" y="120" width="124" height="28" rx="8" fill="#e5566a" fill-opacity=".2" stroke="#e5566a" stroke-opacity=".3"/>
      <rect x="42" y="130" width="70" height="8" rx="4" fill="#ff7387"/>
      <rect x="42" y="166" width="60" height="8" rx="4" opacity=".4"/>
      <rect x="42" y="196" width="75" height="8" rx="4" opacity=".4"/>
      <rect x="42" y="226" width="55" height="8" rx="4" opacity=".4"/>
      <rect x="42" y="256" width="68" height="8" rx="4" opacity=".4"/>
      <rect x="42" y="286" width="50" height="8" rx="4" opacity=".4"/>
      <rect x="42" y="316" width="62" height="8" rx="4" opacity=".4"/>
    </g>

    <!-- Content Area -->
    <!-- Metric cards -->
    <g fill="#ffffff">
      <rect x="174" y="56" width="144" height="80" rx="12" fill="#ffffff" opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="190" y="72" width="50" height="8" rx="4" opacity=".5"/>
      <text x="190" y="116" font-family="Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#ffffff">24</text>
      <rect x="250" y="98" width="54" height="18" rx="9" fill="#3ecf8e" fill-opacity=".2"/>
      <text x="277" y="111" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#3ecf8e">+4 new</text>

      <rect x="332" y="56" width="144" height="80" rx="12" fill="#ffffff" opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="348" y="72" width="65" height="8" rx="4" opacity=".5"/>
      <text x="348" y="116" font-family="Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#ffffff">12</text>
      <rect x="408" y="98" width="54" height="18" rx="9" fill="#f0b43c" fill-opacity=".2"/>
      <text x="435" y="111" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#f0b43c">staff</text>

      <rect x="490" y="56" width="150" height="80" rx="12" fill="#ffffff" opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="506" y="72" width="60" height="8" rx="4" opacity=".5"/>
      <text x="506" y="116" font-family="Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#ffffff">156</text>
      <rect x="576" y="98" width="50" height="18" rx="9" fill="#e5566a" fill-opacity=".2"/>
      <text x="601" y="111" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#ff7387">joueurs</text>
    </g>

    <!-- Data Panel / Ticket list -->
    <rect x="174" y="152" width="466" height="270" rx="14" fill="#ffffff" opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="194" y="172" width="120" height="12" rx="6" fill="#ffffff" opacity=".7"/>
    <rect x="510" y="168" width="110" height="24" rx="8" fill="url(#red)"/>
    <text x="565" y="184" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#ffffff">+ NOUVELLE DEMANDE</text>

    <!-- Rows -->
    <g transform="translate(194 206)">
      <rect width="426" height="42" rx="8" fill="#ffffff" opacity=".04"/>
      <circle cx="20" cy="21" r="5" fill="#f0b43c"/>
      <rect x="36" y="16" width="160" height="10" rx="5" fill="#ffffff" opacity=".8"/>
      <rect x="290" y="12" width="65" height="18" rx="6" fill="#f0b43c" fill-opacity=".2"/>
      <text x="322" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#f0b43c">EN ATTENTE</text>
      <rect x="366" y="16" width="45" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    </g>
    <g transform="translate(194 256)">
      <rect width="426" height="42" rx="8" fill="#ffffff" opacity=".04"/>
      <circle cx="20" cy="21" r="5" fill="#3ecf8e"/>
      <rect x="36" y="16" width="140" height="10" rx="5" fill="#ffffff" opacity=".8"/>
      <rect x="290" y="12" width="65" height="18" rx="6" fill="#3ecf8e" fill-opacity=".2"/>
      <text x="322" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#3ecf8e">TRAITÉ</text>
      <rect x="366" y="16" width="45" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    </g>
    <g transform="translate(194 306)">
      <rect width="426" height="42" rx="8" fill="#ffffff" opacity=".04"/>
      <circle cx="20" cy="21" r="5" fill="#5aa8ef"/>
      <rect x="36" y="16" width="180" height="10" rx="5" fill="#ffffff" opacity=".8"/>
      <rect x="290" y="12" width="65" height="18" rx="6" fill="#5aa8ef" fill-opacity=".2"/>
      <text x="322" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#5aa8ef">EN COURS</text>
      <rect x="366" y="16" width="45" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    </g>
    <g transform="translate(194 356)">
      <rect width="426" height="42" rx="8" fill="#ffffff" opacity=".04"/>
      <circle cx="20" cy="21" r="5" fill="#ff7387"/>
      <rect x="36" y="16" width="120" height="10" rx="5" fill="#ffffff" opacity=".8"/>
      <rect x="290" y="12" width="65" height="18" rx="6" fill="#e5566a" fill-opacity=".2"/>
      <text x="322" y="25" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#ff7387">URGENT</text>
      <rect x="366" y="16" width="45" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    </g>
