  <!-- Floating Badge -->
  <g transform="translate(1180 480)" opacity=".95">
    <rect width="180" height="60" rx="16" fill="#150e12" stroke="#e5566a" stroke-width="2"/>
    <circle cx="34" cy="30" r="14" fill="url(#red)"/>
    <text x="34" y="36" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" font-weight="900" fill="#ffffff">NX</text>
    <text x="60" y="28" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#ffffff">MULTI-ESPACES</text>
    <text x="60" y="44" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#ff7387">Fastify · React · PG</text>
  </g>

  <rect width="1600" height="700" fill="url(#fade)"/>
</svg>
