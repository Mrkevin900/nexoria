<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI,Rubik,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140d12"/>
      <stop offset="1" stop-color="#09080a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190e15"/>
      <stop offset="1" stop-color="#0d090c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7387"/>
      <stop offset="1" stop-color="#e5566a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".15" r=".7">
      <stop offset="0" stop-color="#e5566a" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- Barre latérale -->
  <rect x="0" y="0" width="260" height="800" fill="url(#side)"/>
  <rect x="259" y="0" width="1" height="800" fill="#ffffff" opacity=".08"/>

  <!-- Logo Brand -->
  <g transform="translate(28 32)">
    <rect width="44" height="44" rx="12" fill="url(#accent)"/>
    <text x="22" y="28" text-anchor="middle" font-size="20" font-weight="900" fill="#ffffff">NX</text>
    <text x="56" y="24" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">NEXORIA</text>
    <text x="56" y="42" font-size="12" font-weight="600" fill="#ff7387" letter-spacing="1">DASHBOARD</text>
  </g>

  <!-- Navigation items -->
  <g font-size="14" fill="#c7c7d1">
    <!-- Active Accueil -->
    <rect x="18" y="110" width="224" height="42" rx="10" fill="#e5566a" fill-opacity=".15" stroke="#e5566a" stroke-opacity=".3"/>
    <rect x="18" y="110" width="4" height="42" rx="2" fill="url(#accent)"/>
    <path d="M40 131 L47 124 L54 131 V138 H40 Z" fill="none" stroke="#ff7387" stroke-width="2"/>
    <text x="62" y="136" fill="#ffffff" font-weight="700">Vue d’ensemble</text>

    <!-- Demandes / Tickets -->
    <g transform="translate(0 48)">
      <path d="M41 127 H53 V137 H41 Z M45 127 V123 H49 V127" fill="none" stroke="#9a9aa5" stroke-width="1.8"/>
      <text x="62" y="136">Demandes &amp; Tickets</text>
      <rect x="202" y="122" width="28" height="18" rx="9" fill="#e5566a"/><text x="216" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text>
    </g>

    <!-- Candidatures -->
    <g transform="translate(0 96)">
      <path d="M42 125 H52 M42 130 H52 M42 135 H48" stroke="#9a9aa5" stroke-width="1.8" stroke-linecap="round"/>
      <text x="62" y="136">Candidatures staff</text>
      <rect x="202" y="122" width="28" height="18" rx="9" fill="#f0b43c"/><text x="216" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#111">4</text>
    </g>

    <!-- Calendrier -->
    <g transform="translate(0 144)">
      <rect x="41" y="124" width="14" height="14" rx="3" fill="none" stroke="#9a9aa5" stroke-width="1.8"/>
      <text x="62" y="136">Calendrier &amp; Events</text>
    </g>

    <!-- Joueurs -->
    <g transform="translate(0 192)">
      <circle cx="48" cy="128" r="4" fill="none" stroke="#9a9aa5" stroke-width="1.8"/>
      <path d="M42 138 C42 134 45 133 48 133 C51 133 54 134 54 138" fill="none" stroke="#9a9aa5" stroke-width="1.8"/>
      <text x="62" y="136">Joueurs &amp; Sanctions</text>
    </g>

    <!-- Règlement -->
    <g transform="translate(0 240)">
      <path d="M43 124 H53 V138 H43 Z" fill="none" stroke="#9a9aa5" stroke-width="1.8"/>
      <text x="62" y="136">Règlement officiel</text>
    </g>

    <!-- Lore -->
    <g transform="translate(0 288)">
      <circle cx="48" cy="131" r="6" fill="none" stroke="#9a9aa5" stroke-width="1.8"/>
      <text x="62" y="136">Lore &amp; Royaumes</text>
    </g>

    <!-- Administration -->
    <g transform="translate(0 346)">
      <rect x="18" y="118" width="224" height="1" fill="#ffffff" opacity=".08"/>
      <text x="32" y="142" font-size="11" font-weight="700" fill="#6f6f7b" letter-spacing="1">ADMINISTRATION</text>
    </g>
    <g transform="translate(0 380)">
      <text x="62" y="136">Membres &amp; Rôles</text>
    </g>
    <g transform="translate(0 422)">
      <text x="62" y="136">Journal d’audit</text>
    </g>
  </g>

  <!-- User Card (Steam) -->
  <g transform="translate(18 715)">
    <rect width="224" height="66" rx="14" fill="#ffffff" opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="12" y="13" width="40" height="40" rx="10" fill="url(#accent)"/>
    <text x="32" y="38" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">K</text>
    <text x="62" y="32" font-size="14" font-weight="700" fill="#ffffff">MRkevin</text>
    <rect x="62" y="38" width="80" height="16" rx="8" fill="#e5566a" fill-opacity=".2"/>
    <text x="102" y="50" text-anchor="middle" font-size="9" font-weight="800" fill="#ff7387">SUPERADMIN</text>
  </g>

  <!-- Header principal -->
  <!-- Space switcher -->
  <g transform="translate(295 32)">
    <rect width="210" height="42" rx="12" fill="#ffffff" opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="22" cy="21" r="6" fill="#e5566a"/>
    <text x="38" y="26" font-size="14" font-weight="700" fill="#ffffff">Espace Nexoria Global</text>
    <path d="M190 19 L195 24 L200 19" stroke="#9a9aa5" stroke-width="2" fill="none"/>
  </g>

  <!-- Fastify / API status -->
  <g transform="translate(1080 32)">
    <rect width="165" height="42" rx="12" fill="#3ecf8e" fill-opacity=".1" stroke="#3ecf8e" stroke-opacity=".3"/>
    <circle cx="24" cy="21" r="5" fill="#3ecf8e"/>
    <text x="38" y="26" font-size="12" font-weight="700" fill="#3ecf8e">API FASTIFY EN LIGNE</text>
  </g>

  <!-- Titre page -->
  <text x="295" y="125" font-size="30" font-weight="800" fill="#ffffff">Vue d’ensemble de la structure</text>
  <text x="295" y="152" font-size="14" fill="#a1a1ac">Gestion multi-serveurs, tickets en temps réel, candidatures et base de données PostgreSQL.</text>

  <!-- Cartes Chiffres -->
  <g transform="translate(295 180)">
    <!-- Carte 1 -->
    <rect width="220" height="115" rx="16" fill="#ffffff" opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="22" y="36" font-size="13" font-weight="600" fill="#a1a1ac">Demandes ouvertes</text>
    <text x="22" y="84" font-size="38" font-weight="900" fill="#ffffff">18</text>
    <rect x="135" y="58" width="65" height="24" rx="12" fill="#e5566a" fill-opacity=".2"/>
    <text x="167" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ff7387">5 urgentes</text>

    <!-- Carte 2 -->
    <g transform="translate(240 0)">
      <rect width="220" height="115" rx="16" fill="#ffffff" opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="22" y="36" font-size="13" font-weight="600" fill="#a1a1ac">Candidatures en attente</text>
      <text x="22" y="84" font-size="38" font-weight="900" fill="#ffffff">4</text>
      <rect x="135" y="58" width="65" height="24" rx="12" fill="#f0b43c" fill-opacity=".2"/>
      <text x="167" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#f0b43c">à noter</text>
    </g>

    <!-- Carte 3 -->
    <g transform="translate(480 0)">
      <rect width="220" height="115" rx="16" fill="#ffffff" opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="22" y="36" font-size="13" font-weight="600" fill="#a1a1ac">Événements prévus</text>
      <text x="22" y="84" font-size="38" font-weight="900" fill="#ffffff">3</text>
      <rect x="125" y="58" width="75" height="24" rx="12" fill="#5aa8ef" fill-opacity=".2"/>
      <text x="162" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#5aa8ef">cette sem.</text>
    </g>

    <!-- Carte 4 -->
    <g transform="translate(720 0)">
      <rect width="230" height="115" rx="16" fill="#ffffff" opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="22" y="36" font-size="13" font-weight="600" fill="#a1a1ac">Joueurs enregistrés</text>
      <text x="22" y="84" font-size="38" font-weight="900" fill="#ffffff">184</text>
      <rect x="145" y="58" width="65" height="24" rx="12" fill="#3ecf8e" fill-opacity=".2"/>
      <text x="177" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#3ecf8e">+12 actifs</text>
    </g>
  </g>

  <!-- Dernières demandes (Tableau) -->
  <g transform="translate(295 320)">
    <rect width="615" height="440" rx="18" fill="#ffffff" opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="26" y="40" font-size="18" font-weight="800" fill="#ffffff">Dernières demandes &amp; tickets</text>
    <rect x="470" y="20" width="120" height="32" rx="10" fill="url(#accent)"/>
    <text x="530" y="41" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">+ Nouveau ticket</text>

    <!-- Table header -->
    <g transform="translate(26 70)" font-size="12" font-weight="700" fill="#6f6f7b">
      <text x="0" y="0">SUJET / JOUEUR</text>
      <text x="270" y="0">CATÉGORIE</text>
      <text x="430" y="0">STATUT</text>
      <text x="520" y="0">DATE</text>
      <line x1="0" y1="12" x2="563" y2="12" stroke="#ffffff" stroke-opacity=".08"/>
    </g>

    <!-- Row 1 -->
    <g transform="translate(26 100)">
      <rect width="563" height="52" rx="10" fill="#ffffff" opacity=".04"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#ffffff">Création de famille Silva</text>
      <text x="16" y="40" font-size="11" fill="#a1a1ac">par Nozel_RP · 8 membres</text>
      <text x="270" y="31" font-size="12" fill="#e5e5ea">Famille RP</text>
      <rect x="420" y="16" width="76" height="20" rx="10" fill="#f0b43c" fill-opacity=".2"/>
      <text x="458" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#f0b43c">EN ATTENTE</text>
      <text x="520" y="31" font-size="12" fill="#6f6f7b">14:20</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(26 160)">
      <rect width="563" height="52" rx="10" fill="#ffffff" opacity=".04"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#ffffff">Remboursement Grimoire Astral</text>
      <text x="16" y="40" font-size="11" fill="#a1a1ac">par Yuno_77 · crash serveur</text>
      <text x="270" y="31" font-size="12" fill="#e5e5ea">Remboursement</text>
      <rect x="420" y="16" width="76" height="20" rx="10" fill="#5aa8ef" fill-opacity=".2"/>
      <text x="458" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#5aa8ef">EN COURS</text>
      <text x="520" y="31" font-size="12" fill="#6f6f7b">12:05</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(26 220)">
      <rect width="563" height="52" rx="10" fill="#ffffff" opacity=".04"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#ffffff">Signalement FreeKill Zone Neutre</text>
      <text x="16" y="40" font-size="11" fill="#a1a1ac">par Asta_G · preuves vidéo</text>
      <text x="270" y="31" font-size="12" fill="#e5e5ea">Signalement</text>
      <rect x="420" y="16" width="76" height="20" rx="10" fill="#3ecf8e" fill-opacity=".2"/>
      <text x="458" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#3ecf8e">TRAITÉ</text>
      <text x="520" y="31" font-size="12" fill="#6f6f7b">Hier</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(26 280)">
      <rect width="563" height="52" rx="10" fill="#ffffff" opacity=".04"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#ffffff">Contestation Avertissement HRP</text>
      <text x="16" y="40" font-size="11" fill="#a1a1ac">par Magna_Swing · warn n°2</text>
      <text x="270" y="31" font-size="12" fill="#e5e5ea">Sanctions</text>
      <rect x="420" y="16" width="76" height="20" rx="10" fill="#ff7387" fill-opacity=".2"/>
      <text x="458" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#ff7387">URGENT</text>
      <text x="520" y="31" font-size="12" fill="#6f6f7b">05/11</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(26 340)">
      <rect width="563" height="52" rx="10" fill="#ffffff" opacity=".04"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#ffffff">Proposition Nouveau Clan des Ombres</text>
      <text x="16" y="40" font-size="11" fill="#a1a1ac">par Yami_Sukehiro · staff lore</text>
      <text x="270" y="31" font-size="12" fill="#e5e5ea">Création clan</text>
      <rect x="420" y="16" width="76" height="20" rx="10" fill="#3ecf8e" fill-opacity=".2"/>
      <text x="458" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#3ecf8e">ACCEPTÉ</text>
      <text x="520" y="31" font-size="12" fill="#6f6f7b">04/11</text>
    </g>
  </g>

  <!-- Panneau latéral droit : Événements & Staff -->
  <g transform="translate(930 320)">
    <rect width="315" height="440" rx="18" fill="#ffffff" opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="22" y="40" font-size="18" font-weight="800" fill="#ffffff">Prochains événements</text>

    <!-- Event 1 -->
    <g transform="translate(22 70)">
      <rect width="271" height="74" rx="12" fill="#ffffff" opacity=".04"/>
      <rect x="14" y="14" width="4" height="46" rx="2" fill="#e5566a"/>
      <text x="28" y="30" font-size="14" font-weight="700" fill="#ffffff">Invasion de Spade</text>
      <text x="28" y="48" font-size="12" fill="#a1a1ac">Samedi 21:00 · Event RP</text>
    </g>

    <!-- Event 2 -->
    <g transform="translate(22 154)">
      <rect width="271" height="74" rx="12" fill="#ffffff" opacity=".04"/>
      <rect x="14" y="14" width="4" height="46" rx="2" fill="#5aa8ef"/>
      <text x="28" y="30" font-size="14" font-weight="700" fill="#ffffff">Réunion staff mensuelle</text>
      <text x="28" y="48" font-size="12" fill="#a1a1ac">Dimanche 20:30 · Vocal Discord</text>
    </g>

    <!-- Event 3 -->
    <g transform="translate(22 238)">
      <rect width="271" height="74" rx="12" fill="#ffffff" opacity=".04"/>
      <rect x="14" y="14" width="4" height="46" rx="2" fill="#f0b43c"/>
      <text x="28" y="30" font-size="14" font-weight="700" fill="#ffffff">Tournoi des Compagnies</text>
      <text x="28" y="48" font-size="12" fill="#a1a1ac">Mercredi 20:00 · Arène royale</text>
    </g>

    <!-- Info box -->
    <g transform="translate(22 330)">
      <rect width="271" height="85" rx="12" fill="#e5566a" fill-opacity=".1" stroke="#e5566a" stroke-opacity=".25"/>
      <text x="18" y="28" font-size="13" font-weight="700" fill="#ff7387">Plateforme centralisée</text>
      <text x="18" y="48" font-size="11" fill="#c7c7d1">Connectée en direct à PostgreSQL et</text>
      <text x="18" y="64" font-size="11" fill="#c7c7d1">aux serveurs Garry's Mod de Nexoria.</text>
    </g>
  </g>

  <!-- Tag Image Exemple -->
  <g transform="translate(1100 12)">
    <rect width="166" height="26" rx="13" fill="#000000" opacity=".6"/>
    <text x="83" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#ff7387" letter-spacing="1">APERÇU OFFICIEL</text>
  </g>
</svg>
