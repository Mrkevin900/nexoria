<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="nslogog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5264"/>
      <stop offset="1" stop-color="#b81d33"/>
    </linearGradient>
    <filter id="nsglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#120c10" stroke="#331820" stroke-width="3"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#e5525f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Central Nexus Core -->
  <polygon points="100,42 148,70 148,130 100,158 52,130 52,70" fill="url(#nslogog)" filter="url(#nsglow)"/>
  <polygon points="100,60 134,80 134,120 100,140 66,120 66,80" fill="#0d070a" opacity=".85"/>
  <text x="100" y="112" text-anchor="middle" font-family="Sora,sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-1">NX</text>
  <circle cx="100" cy="42" r="5" fill="#ffffff"/>
  <circle cx="148" cy="70" r="5" fill="#ffffff"/>
  <circle cx="148" cy="130" r="5" fill="#ffffff"/>
  <circle cx="100" cy="158" r="5" fill="#ffffff"/>
  <circle cx="52" cy="130" r="5" fill="#ffffff"/>
  <circle cx="52" cy="70" r="5" fill="#ffffff"/>
</svg>