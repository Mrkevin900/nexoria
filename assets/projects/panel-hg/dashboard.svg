      <g transform="translate(26 376)"><rect width="508" height="62" rx="12" fill="#ffffff" opacity=".04"/><circle cx="32" cy="31" r="16" fill="#a855f7"/><text x="62" y="27" font-weight="600">Œil Pourpre</text><text x="62" y="47" font-size="13" fill="#9a9aa5">Capitaine · 9 membres</text><rect x="330" y="25" width="150" height="10" rx="5" fill="#ffffff" opacity=".1"/><rect x="330" y="25" width="92" height="10" rx="5" fill="url(#silver)"/></g>
