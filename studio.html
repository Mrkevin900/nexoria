<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<script>(function(){var r=document.documentElement,p={};try{p=JSON.parse(localStorage.getItem("nx-prefs")||"{}")}catch(e){}r.classList.add("js");if(p.anim===false||p.reduce)r.classList.add("noanim")})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nexus Studio — NEXORIA</title>
<meta name="theme-color" content="#07070a">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/studio.css">
</head>
<body class="studio locked">
<div class="s-boot" id="boot" aria-hidden="true"><span>NEXUS <i>STUDIO</i></span></div>

<div class="s-bg" aria-hidden="true">
  <div class="layer grid" data-p=".15"></div>
  <div class="layer o-a" data-p=".35"><i class="orb"></i></div>
  <div class="layer o-b" data-p=".55"><i class="orb o2"></i></div>
</div>
<canvas id="pc" aria-hidden="true"></canvas>

<!-- ===================== PORTAIL ===================== -->
<section class="gate" id="gate" hidden aria-label="Connexion à Nexus Studio">
  <div class="g-emblem" id="gEmb" aria-hidden="true">
    <svg class="tech t1" viewBox="0 0 400 400" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="200" cy="200" r="190" stroke-dasharray="3 12"/></svg><svg class="tech t2" viewBox="0 0 400 400" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="200" cy="200" r="150" stroke-dasharray="70 18 8 18" stroke-width="1.5"/></svg><svg class="tech" viewBox="0 0 400 400" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="200" cy="200" r="100" opacity=".6"/><path d="M200 5v40M200 355v40M5 200h40M355 200h40" stroke-width="2"/></svg>
    <i class="g-orbit"></i>
    <img src="assets/img/nexoria-logo.png" alt="" width="640" height="421">
  </div>
  <div class="g-card" id="gCard">
    <p class="kicker">Espace direction · chiffré de bout en bout</p>
    <h1>NEXUS<i>STUDIO</i></h1>
    <p class="lead">Le QG privé de NEXORIA : projets, idées secrètes, discussions et publication du site. Choisis ton profil.</p>
    <div class="who" id="who" role="group" aria-label="Profil"></div>
    <form class="g-form" id="gForm" hidden autocomplete="off">
      <label for="c0">Code d’accès de <b id="gName"></b></label>
      <div class="code" id="code"></div>
      <div class="g-row">
        <label><input type="checkbox" id="gRemember"> Rester connecté sur cet appareil</label>
        <span class="mono-f" id="gCount">0 / 12</span>
      </div>
      <button class="btn main" type="submit" id="gBtn">Déverrouiller le studio</button>
      <p class="g-msg" id="gMsg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="g-foot"><a class="btn" href="index.html">← Retour au site</a></div>
</section>

<!-- ===================== STUDIO ===================== -->
<div id="app" hidden>
  <header class="nav s-nav" id="sNav"><div class="wrap">
    <a class="s-brand" href="#qg" aria-label="Nexus Studio, accueil du QG"><img src="assets/img/nexoria-logo.png" alt="" width="50" height="33"><span><b>NEXUS <i>STUDIO</i></b><small>QG NEXORIA</small></span></a>
    <nav class="s-tabs" id="tabs" aria-label="Sections du studio"><span class="s-ind" id="ind"></span></nav>
    <div class="s-right" id="right"></div>
  </div></header>
  <main class="s-main" id="main">
    <section class="s-view" id="v-qg" aria-label="QG"></section>
    <section class="s-view" id="v-projets" aria-label="Projets"></section>
    <section class="s-view" id="v-idees" aria-label="Idées"></section>
    <section class="s-view" id="v-notes" aria-label="Discussions"></section>
    <section class="s-view" id="v-site" aria-label="Textes du site"></section>
    <section class="s-view" id="v-equipe" aria-label="Équipe"></section>
    <section class="s-view" id="v-reglages" aria-label="Réglages"></section>
  </main>
</div>

<div id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">Nexus Studio a besoin de JavaScript.</p></noscript>

<script src="config.js"></script>
<script src="assets/js/nx-render.js"></script>
<script src="assets/js/studio.js"></script>
</body>
</html>
